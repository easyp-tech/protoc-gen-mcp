# .spec/config.yaml
context: Go 1.24+ protoc plugin, multi-language codegen (Go/Python/Kotlin/Java/TypeScript), easyp v0.15.2-rc1, google.golang.org/protobuf, github.com/modelcontextprotocol/go-sdk/mcp v1.6.0, proto3 only, MCP spec 2025-11-25
