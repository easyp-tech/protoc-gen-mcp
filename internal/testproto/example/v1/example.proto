// ReportDetails contains nested report options.
message ReportDetails {
  // label is an arbitrary label.
  string label = 1;
}

// RecursiveNode exercises recursive message schemas.
message RecursiveNode {
  // name identifies the current node.
  string name = 1;

  // child points at the next recursive node.
  RecursiveNode child = 2 [(api.mcp.options.v1.field).optional = true];

  // children holds repeated recursive nodes.
  repeated RecursiveNode children = 3;
}

// ReportStatus describes the report state.
enum ReportStatus {
  // REPORT_STATUS_NONE is the default enum value.
  REPORT_STATUS_NONE = 0;

  // REPORT_STATUS_OK indicates a successful report.
  REPORT_STATUS_OK = 1;

  // REPORT_STATUS_FAILED indicates a failed report.
  REPORT_STATUS_FAILED = 2;
}
