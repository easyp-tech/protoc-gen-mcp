  google.protobuf.Timestamp observed_at = 4 [(api.mcp.options.v1.field).optional = true];

  // ttl is represented as a protobuf duration string.
  google.protobuf.Duration ttl = 5 [(api.mcp.options.v1.field).optional = true];

  // payload accepts arbitrary JSON objects.
  google.protobuf.Struct payload = 6 [(api.mcp.options.v1.field).optional = true];

  // items accepts arbitrary JSON arrays.
  google.protobuf.ListValue items = 7 [(api.mcp.options.v1.field).optional = true];

  // dynamic accepts arbitrary JSON values.
  google.protobuf.Value dynamic = 8 [(api.mcp.options.v1.field).optional = true];

  // note exercises `StringValue` wrapper support.
  google.protobuf.StringValue note = 9 [(api.mcp.options.v1.field).optional = true];

  // total exercises Int64Value wrapper support.
  google.protobuf.Int64Value total = 10 [(api.mcp.options.v1.field).optional = true];

  // enabled exercises BoolValue wrapper support.
  google.protobuf.BoolValue enabled = 11 [(api.mcp.options.v1.field).optional = true];

  // ratio exercises ProtoJSON float special values.
  google.protobuf.DoubleValue ratio = 12 [(api.mcp.options.v1.field).optional = true];

  // mask exercises FieldMask string support.
  google.protobuf.FieldMask mask = 13 [(api.mcp.options.v1.field).optional = true];

  // blob exercises BytesValue wrapper support.
  google.protobuf.BytesValue blob = 15 [(api.mcp.options.v1.field).optional = true];

  // small_total exercises Int32Value wrapper support.
  google.protobuf.Int32Value small_total = 16 [(api.mcp.options.v1.field).optional = true];

  // uint_total exercises UInt32Value wrapper support.
  google.protobuf.UInt32Value uint_total = 17 [(api.mcp.options.v1.field).optional = true];

  // huge_total exercises UInt64Value wrapper support.
  google.protobuf.UInt64Value huge_total = 18 [(api.mcp.options.v1.field).optional = true];

  // weight exercises FloatValue wrapper support.
  google.protobuf.FloatValue weight = 19 [(api.mcp.options.v1.field).optional = true];

  // raw_ratio exercises raw double ProtoJSON float support.
  optional double raw_ratio = 20;

  // tree exercises recursive message schemas.
  RecursiveNode tree = 24 [(api.mcp.options.v1.field).optional = true];

  // detail_any exercises Any with a regular embedded message payload.
  // Example: {"@type":"type.googleapis.com/internal.testproto.example.v1.ReportDetails","label":"from-any"}
  google.protobuf.Any detail_any = 25 [(api.mcp.options.v1.field).optional = true];

  // duration_any exercises Any with a well-known embedded payload.
  // Example: {"@type":"type.googleapis.com/google.protobuf.Duration","value":"3600s"}
  google.protobuf.Any duration_any = 26 [(api.mcp.options.v1.field).optional = true];

  // selector exercises top-level oneof support.
  oneof selector {
    // city_alias exercises string oneof members.
    string city_alias = 21;

    // city_id exercises int64 oneof members with ProtoJSON string encoding.
    int64 city_id = 22;

    // city_details exercises message oneof members.
    ReportDetails city_details = 23;
  }
}

