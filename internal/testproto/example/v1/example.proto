syntax = "proto3";

package internal.testproto.example.v1;

option go_package = "github.com/easyp-tech/protoc-gen-mcp/internal/testproto/example/v1;examplev1";

import "api/mcp/options/v1/options.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// ExampleAPI exposes test MCP tools used by repository tests.
service ExampleAPI {
  option (api.mcp.options.v1.service) = {
    namespace: "example"
  };

  // CreateReport creates a report for a city.
  //
  // Example: {"city":"Paris","count":2,"details":{"label":"today"}}
  rpc CreateReport(CreateReportRequest) returns (CreateReportResponse) {
    option (api.mcp.options.v1.method) = {
      title: "Create report"
      description: "Create a report for a city."
      examples: "{\"city\":\"Paris\",\"count\":2,\"details\":{\"label\":\"today\"}}"
    };
  }

  // Ping returns an empty response.
  rpc Ping(PingRequest) returns (PingResponse) {
    option (api.mcp.options.v1.method) = {
      name: "Health"
      title: "Health check"
    };
  }

  // DescribeAdvancedShapes exercises maps and well-known protobuf types.
  rpc DescribeAdvancedShapes(DescribeAdvancedShapesRequest) returns (DescribeAdvancedShapesResponse) {
    option (api.mcp.options.v1.method) = {
      title: "Describe advanced shapes"
      description: "Exercise maps and well-known protobuf types."
    };
  }

  // DescribeScalarShapes exercises plain protobuf scalar kinds.
  rpc DescribeScalarShapes(DescribeScalarShapesRequest) returns (DescribeScalarShapesResponse) {
    option (api.mcp.options.v1.method) = {
      title: "Describe scalar shapes"
      description: "Exercise plain protobuf scalar kinds."
    };
  }

  // HiddenThing is intentionally hidden from generated tools.
  rpc HiddenThing(HiddenThingRequest) returns (HiddenThingResponse) {
    option (api.mcp.options.v1.method) = {
      hidden: true
    };
  }
}

// CreateReportRequest describes a report generation request.
message CreateReportRequest {
  // city is the city name.
  string city = 1 [(api.mcp.options.v1.field) = {
    description: "City name."
  }];

  // count is the number of requested items.
  int32 count = 2;

  // details contains nested report options.
  ReportDetails details = 3;

  // units overrides the default units.
  optional string units = 4;

  // labels adds additional labels.
  repeated string labels = 5;
}

// CreateReportResponse describes a report generation result.
message CreateReportResponse {
  // report_id is the generated report identifier.
  string report_id = 1;

  // total_count is returned as a ProtoJSON string.
  int64 total_count = 2;

  // status is the final report status.
  ReportStatus status = 3;

  // details echoes the nested options.
  ReportDetails details = 4;

  // warnings contains optional warning messages.
  repeated string warnings = 5;
}

// HiddenThingRequest is used by the hidden RPC.
message HiddenThingRequest {
  // name is the hidden request payload.
  string name = 1;
}

// HiddenThingResponse is used by the hidden RPC.
message HiddenThingResponse {}

// PingRequest is used by the health-check RPC.
message PingRequest {}

// PingResponse is used by the health-check RPC.
message PingResponse {
  // ack confirms the health-check call.
  google.protobuf.Empty ack = 1;
}

// DescribeAdvancedShapesRequest exercises supported advanced protobuf shapes.
message DescribeAdvancedShapesRequest {
  // labels stores arbitrary string metadata.
  map<string, string> labels = 1;

  // quantities demonstrates numeric map keys encoded as JSON object keys.
  map<int32, string> quantities = 2;

  // toggles demonstrates bool map keys encoded as JSON object keys.
  map<bool, string> toggles = 3;

  // limits demonstrates unsigned numeric map keys encoded as JSON object keys.
  map<uint64, string> limits = 14;

  // observed_at is represented as an RFC 3339 timestamp string.
  google.protobuf.Timestamp observed_at = 4 [(api.mcp.options.v1.field).optional = true];

  // ttl is represented as a protobuf duration string.
  google.protobuf.Duration ttl = 5 [(api.mcp.options.v1.field).optional = true];

  // payload accepts arbitrary JSON objects.
  google.protobuf.Struct payload = 6 [(api.mcp.options.v1.field).optional = true];

  // items accepts arbitrary JSON arrays.
  google.protobuf.ListValue items = 7 [(api.mcp.options.v1.field).optional = true];

  // dynamic accepts arbitrary JSON values.
  google.protobuf.Value dynamic = 8 [(api.mcp.options.v1.field).optional = true];

  // note exercises `StringValue` wrapper support.
  google.protobuf.StringValue note = 9 [(api.mcp.options.v1.field).optional = true];

  // total exercises Int64Value wrapper support.
  google.protobuf.Int64Value total = 10 [(api.mcp.options.v1.field).optional = true];

  // enabled exercises BoolValue wrapper support.
  google.protobuf.BoolValue enabled = 11 [(api.mcp.options.v1.field).optional = true];

  // ratio exercises ProtoJSON float special values.
  google.protobuf.DoubleValue ratio = 12 [(api.mcp.options.v1.field).optional = true];

  // mask exercises FieldMask string support.
  google.protobuf.FieldMask mask = 13 [(api.mcp.options.v1.field).optional = true];

  // blob exercises BytesValue wrapper support.
  google.protobuf.BytesValue blob = 15 [(api.mcp.options.v1.field).optional = true];

  // small_total exercises Int32Value wrapper support.
  google.protobuf.Int32Value small_total = 16 [(api.mcp.options.v1.field).optional = true];

  // uint_total exercises UInt32Value wrapper support.
  google.protobuf.UInt32Value uint_total = 17 [(api.mcp.options.v1.field).optional = true];

  // huge_total exercises UInt64Value wrapper support.
  google.protobuf.UInt64Value huge_total = 18 [(api.mcp.options.v1.field).optional = true];

  // weight exercises FloatValue wrapper support.
  google.protobuf.FloatValue weight = 19 [(api.mcp.options.v1.field).optional = true];

  // raw_ratio exercises raw double ProtoJSON float support.
  optional double raw_ratio = 20;

  // tree exercises recursive message schemas.
  RecursiveNode tree = 24 [(api.mcp.options.v1.field).optional = true];

  // detail_any exercises Any with a regular embedded message payload.
  // Example: {"@type":"type.googleapis.com/internal.testproto.example.v1.ReportDetails","label":"from-any"}
  google.protobuf.Any detail_any = 25 [(api.mcp.options.v1.field).optional = true];

  // duration_any exercises Any with a well-known embedded payload.
  // Example: {"@type":"type.googleapis.com/google.protobuf.Duration","value":"3600s"}
  google.protobuf.Any duration_any = 26 [(api.mcp.options.v1.field).optional = true];

  // selector exercises top-level oneof support.
  oneof selector {
    // city_alias exercises string oneof members.
    string city_alias = 21;

    // city_id exercises int64 oneof members with ProtoJSON string encoding.
    int64 city_id = 22;

    // city_details exercises message oneof members.
    ReportDetails city_details = 23;
  }
}

// DescribeAdvancedShapesResponse echoes supported advanced protobuf shapes.
message DescribeAdvancedShapesResponse {
  // labels stores arbitrary string metadata.
  map<string, string> labels = 1;

  // quantities demonstrates numeric map keys encoded as JSON object keys.
  map<int32, string> quantities = 2;

  // toggles demonstrates bool map keys encoded as JSON object keys.
  map<bool, string> toggles = 3;

  // limits demonstrates unsigned numeric map keys encoded as JSON object keys.
  map<uint64, string> limits = 14;

