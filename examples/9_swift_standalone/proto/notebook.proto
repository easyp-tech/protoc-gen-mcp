syntax = "proto3";

package standalone.notebook.v1;

import "google/protobuf/timestamp.proto";
import "mcp/options/v1/options.proto";

// Over HTTP the notebook is an OAuth protected resource: every request needs
// notebook:read, and DeleteNote also needs notebook:write. Run the server with
// --http --demo-auth to try it with the local tokens demo-read and demo-write.
option (mcp.options.v1.server) = {
  name: "standalone-swift-notebook"
  version: "0.1.0"
  oauth: {
    resource_url: "https://notebook.example.com/mcp"
    authorization_servers: "https://auth.example.com"
    scopes: "notebook:read"
    issuer: "https://auth.example.com"
    jwks_uri: "https://auth.example.com/.well-known/jwks.json"
    audience: "https://notebook.example.com/mcp"
  }
};

service NotebookAPI {
  option (mcp.options.v1.service) = {
    namespace: "notebook"
    description: "A small in-memory notebook service for generated Swift MCP bindings."
  };

  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse) {
    option (mcp.options.v1.method) = {
      title: "Create note"
      description: "Create a note in the local in-memory notebook."
      annotations: {
        destructive_hint: false
        idempotent_hint: false
        open_world_hint: false
      }
    };
  }

  rpc SearchNotes(SearchNotesRequest) returns (SearchNotesResponse) {
    option (mcp.options.v1.method) = {
      title: "Search notes"
      description: "Search notes by text and tags."
      annotations: {
        read_only_hint: true
        open_world_hint: false
      }
    };
  }

  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse) {
    option (mcp.options.v1.method) = {
      title: "Delete note"
      description: "Delete a note. Needs the notebook:write scope, so it is denied without a token, for example over stdio."
      required_scopes: "notebook:write"
      annotations: {
        destructive_hint: true
        idempotent_hint: true
        open_world_hint: false
      }
    };
  }

  rpc Health(HealthRequest) returns (HealthResponse) {
    option (mcp.options.v1.method) = {
      title: "Notebook health"
      description: "Verify that the notebook MCP server is alive."
      annotations: {
        read_only_hint: true
        open_world_hint: false
      }
    };
  }
}

message Note {
  option (mcp.options.v1.resource) = {
    name: "note"
    uri_template: "notebook://notes/{id}"
    description: "A note from the in-memory notebook, addressed by its id."
  };

  string id = 1 [(mcp.options.v1.field) = {
    read_only: true
    description: "Server-assigned note identifier."
    examples: [{ string_value: "note-1" }]
  }];

  string title = 2 [(mcp.options.v1.field) = {
    description: "Short human-readable note title."
    min_length: 1
    max_length: 80
    examples: [{ string_value: "Ship Swift support" }]
  }];

  string body = 3 [(mcp.options.v1.field) = {
    description: "Note body in plain text."
    min_length: 1
    max_length: 2000
    examples: [{ string_value: "Verify that generated Swift MCP bindings are pleasant to use." }]
  }];

  repeated string tags = 4 [(mcp.options.v1.field) = {
    description: "Optional tags used for filtering."
    unique_items: true
    examples: [
      { array_value: { items: [{ string_value: "swift" }, { string_value: "mcp" }] } }
    ]
  }];

  optional string due_date = 5 [(mcp.options.v1.field) = {
    description: "Optional due date in ISO 8601 date format."
    format: "date"
    examples: [{ string_value: "2026-05-30" }]
  }];

  google.protobuf.Timestamp created_at = 6 [(mcp.options.v1.field) = {
    read_only: true
    description: "Server-assigned creation timestamp."
  }];
}

message CreateNoteRequest {
  string title = 1 [(mcp.options.v1.field) = {
    description: "Short human-readable note title."
    min_length: 1
    max_length: 80
    examples: [{ string_value: "Ship Swift support" }]
  }];

  string body = 2 [(mcp.options.v1.field) = {
    description: "Note body in plain text."
    min_length: 1
    max_length: 2000
    examples: [{ string_value: "Verify that generated Swift MCP bindings are pleasant to use." }]
  }];

  repeated string tags = 3 [(mcp.options.v1.field) = {
    description: "Optional tags used for filtering."
    unique_items: true
    examples: [
      { array_value: { items: [{ string_value: "swift" }, { string_value: "mcp" }] } }
    ]
  }];

  optional string due_date = 4 [(mcp.options.v1.field) = {
    description: "Optional due date in ISO 8601 date format."
    format: "date"
    examples: [{ string_value: "2026-05-30" }]
  }];
}

message CreateNoteResponse {
  Note note = 1;
}

message SearchNotesRequest {
  optional string query = 1 [(mcp.options.v1.field) = {
    description: "Optional case-insensitive text query matched against title and body."
    min_length: 1
    examples: [{ string_value: "swift" }]
  }];

  repeated string tags = 2 [(mcp.options.v1.field) = {
    description: "Optional tags; a note must have every requested tag."
    unique_items: true
    examples: [
      { array_value: { items: [{ string_value: "mcp" }] } }
    ]
  }];

  optional int32 limit = 3 [(mcp.options.v1.field) = {
    description: "Maximum number of notes to return."
    minimum: 1.0
    maximum: 50.0
    default_value: { integer_value: 10 }
  }];
}

message SearchNotesResponse {
  repeated Note notes = 1;
}

message DeleteNoteRequest {
  string id = 1 [(mcp.options.v1.field) = {
    description: "Identifier of the note to delete."
    min_length: 1
  }];
}

message DeleteNoteResponse {
  bool deleted = 1 [(mcp.options.v1.field) = {
    description: "Whether a note with this id existed and was deleted."
  }];
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  int32 note_count = 2 [(mcp.options.v1.field) = {
    read_only: true
    description: "Current number of notes in memory."
  }];
}

message ReviewNote {
  option (mcp.options.v1.prompt) = {
    name: "review_note"
    title: "Review note"
    description: "Ask the model to review a note and suggest a clearer version."
  };

  string note_id = 1 [(mcp.options.v1.field) = {
    description: "Identifier of the note to review."
  }];

  optional string focus = 2 [(mcp.options.v1.field) = {
    description: "Optional aspect to focus on, for example tone or brevity."
  }];
}
