[project]
name = "protoc-gen-mcp-python-standalone-example"
version = "0.1.0"
description = "Standalone Python MCP server generated from protobuf with protoc-gen-mcp."
requires-python = ">=3.10"
dependencies = [
    "anyio>=4,<5",
    "jsonschema>=4,<5",
    "mcp>=1.30,<2",
    "protobuf>=6,<7",
    "protoc-gen-mcp-runtime>=1.0,<2",
    "uvicorn>=0.31,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

# protoc-gen-mcp-runtime is not on PyPI yet. `make setup` installs it from
# ../../runtime/python; uv resolves it from the same path through this source.
[tool.uv.sources]
protoc-gen-mcp-runtime = { path = "../../runtime/python" }

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
