name: go sdk smoke
on:
  pull_request:
    branches: [master]
  push:
    branches: [feat/go-sdk-mcp-apps-modernization]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compile and run SDK migration tests with bounded timeout
        run: |
          go test -v -count=1 -timeout=30s ./mcpruntime
          go test -v -count=1 -timeout=45s ./internal/examplemcp -run 'TestServerOverStdio|TestResourcesPromptsRoundTrip|TestGeneratedAppUIFromProto|TestPromptsGetMissingRequiredArg'
