name: go sdk smoke
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: [pinned, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify compatibility gate
        run: |
          python3 -m unittest discover -s scripts -p 'test_go_sdk_compatibility.py'
      - name: Compile generated fixtures and goldens and run SDK smoke tests
        run: python3 scripts/check-go-sdk-compatibility.py --sdk '${{ matrix.sdk }}'
