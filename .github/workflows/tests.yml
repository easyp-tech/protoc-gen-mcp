name: tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/codegen/testdata/node/package-lock.json

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Install easyp
        run: go install github.com/easyp-tech/easyp/cmd/easyp@v0.15.2-rc1

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      - name: Validate configs
        run: |
          easyp --cfg easyp.yaml validate-config
          easyp --cfg easyp.test.yaml validate-config
          easyp --cfg easyp.showcase.yaml validate-config

      - name: Lint protobuf packages
        run: |
          easyp --cfg easyp.yaml lint -p mcp -r .
          easyp --cfg easyp.test.yaml lint -p internal/testproto -r .
          easyp --cfg easyp.showcase.yaml lint -p examples/11_protobuf_first_mcp/proto -r .

      - name: Regenerate protobuf packages
        run: |
          easyp --cfg easyp.yaml generate -p mcp -r .
          easyp --cfg easyp.test.yaml generate -p internal/testproto -r .
          easyp --cfg easyp.showcase.yaml generate -p examples/11_protobuf_first_mcp/proto -r .

      - name: Regenerate example artifacts
        run: |
          cd examples
          make generate

      - name: Verify generated files are up to date
        run: git diff --exit-code

      - name: Install Node dependencies
        working-directory: internal/codegen/testdata/node
        run: npm ci

      - name: Typecheck TypeScript test harness
        working-directory: internal/codegen/testdata/node
        run: npm run typecheck

      - name: Build TypeScript test harness
        working-directory: internal/codegen/testdata/node
        run: npm run build

      - name: Run generated Node stdio tests
        run: go test ./internal/codegen -run 'TestTypeScriptGeneratedNodeServer.*OverStdio|TestTypeScriptGeneratedNodeServerRejectsInvalid(Input|Output)OverStdio' -count=1

      - name: Build JVM examples
        run: |
          gradle --no-daemon -p internal/examplemcp/jvm :java-server:compileJava :kotlin-server:compileKotlin
          gradle --no-daemon -p internal/examplemcp/jvm :java-server:installDist :kotlin-server:installDist

      - name: Run JVM stdio tests
        run: |
          go test ./internal/examplemcp -run 'TestJava.*OverStdio' -count=1
          go test ./internal/examplemcp -run 'TestKotlin.*OverStdio' -count=1

      - name: Verify runnable protobuf-first showcase
        run: |
          go test ./examples/11_protobuf_first_mcp/... -count=1
          go build -o /tmp/showcase-mcp-server ./examples/11_protobuf_first_mcp
          go build -o /tmp/showcase-mcp-client ./examples/11_protobuf_first_mcp/client

      - name: Run tests
        run: go test ./...

  coverage:
    name: Library coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install easyp
        run: go install github.com/easyp-tech/easyp/cmd/easyp@v0.15.2-rc1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/codegen/testdata/node/package-lock.json

      - name: Install Node dependencies
        working-directory: internal/codegen/testdata/node
        run: npm ci

      - name: Enforce 80% coverage for product packages
        run: |
          for pkg in ./mcpruntime ./internal/codegen; do
            go test -count=1 -covermode=atomic -coverprofile=package.out "$pkg"
            total="$(go tool cover -func=package.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')"
            echo "$pkg coverage: $total%"
            if ! awk -v total="$total" 'BEGIN { exit !(total + 0 >= 80) }'; then
              echo "coverage for $pkg is below 80%" >&2
              exit 1
            fi
          done
          go test -count=1 -covermode=atomic -coverprofile=coverage.out ./mcpruntime ./internal/codegen
          go tool cover -func=coverage.out | tail -1

      - name: Publish coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang
