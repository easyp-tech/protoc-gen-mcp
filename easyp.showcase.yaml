# Generate the runnable protobuf-first example from the local repository source.
# Unlike examples/easyp.yaml, this config does not resolve the older released
# options.proto through a pinned external module.
generate:
  inputs:
    - directory:
        path: examples/11_protobuf_first_mcp/proto
        root: "."
  plugins:
    - name: go
      out: .
      opts:
        paths: source_relative
    - command: ["go", "run", "./cmd/protoc-gen-mcp"]
      out: .
      opts:
        paths: source_relative
