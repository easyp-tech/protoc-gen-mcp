[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "protoc-gen-mcp-runtime"
version = "1.0.0"
description = "Runtime for Python MCP servers generated by protoc-gen-mcp."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "mcp>=1.30,<2",
    "jsonschema>=4",
    "protobuf>=6,<7",
]

[project.urls]
Homepage = "https://github.com/easyp-tech/protoc-gen-mcp"

[tool.setuptools]
packages = ["protoc_gen_mcp_runtime"]
